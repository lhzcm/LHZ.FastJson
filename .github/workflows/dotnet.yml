# This workflow will build and Test a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Test_DotNet_Project

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0
    - name: Restore dependencies
      run: dotnet restore src/LHZ.FastJson.sln
    - name: Build
      run: dotnet build src/LHZ.FastJson --no-restore
    - name: Test
      run: dotnet test src/LHZ.FastJson.UnitTest --verbosity normal
